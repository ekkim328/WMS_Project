services:
  - type: web
    name: wms-project
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /healthz
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: wms-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE
        value: 0
      - key: REFRESH_TOKEN_EXPIRE
        value: 604800

databases:
  - name: wms-db
    databaseName: wms
    user: wms_user
    plan: free
